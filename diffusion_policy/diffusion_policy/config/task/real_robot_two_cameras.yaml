name: real_robot_two_cameras

image_shape: [3, 240, 320]
dataset_path: data/training/two_cameras_sphere

shape_meta: &shape_meta
  # Two cameras: camera_0 (0.mp4) and camera_1 (1.mp4)
  obs:
    camera_0:
      shape: ${task.image_shape}
      type: rgb
    camera_1:
      shape: ${task.image_shape}
      type: rgb
    # 6D end-effector pose (x, y, z, roll, pitch, yaw)
    robot_eef_pose:
      shape: [6]
      type: low_dim
  action: 
    # 6D action (x, y, z, roll, pitch, yaw)
    shape: [6]

# No env_runner for real robot (eval is done on physical robot)
env_runner: null

dataset:
  _target_: diffusion_policy.dataset.real_pusht_image_dataset.RealPushTImageDataset
  shape_meta: *shape_meta
  dataset_path: ${task.dataset_path}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  n_latency_steps: ${n_latency_steps}
  use_cache: True
  seed: 42
  val_ratio: 0.02
  max_train_episodes: null
  delta_action: False
