# Flow Matching Hybrid Image Policy Config
# Aligned with diffusion_policy/image_pusht_diffusion_policy_cnn.yaml
# Only changes: policy -> FlowMatchingUnetHybridImagePolicy, workspace -> TrainFlowMatchingUnetHybridImageWorkspace

defaults:
  - _self_
  - task: pusht_image

name: train_fm_unet_hybrid
_target_: dpfm.workspace.train_fm_unet_hybrid_image_workspace.TrainFlowMatchingUnetHybridImageWorkspace

exp_name: default
task_name: pusht_image

# === Key Paper Settings ===
horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
obs_as_global_cond: true
past_action_visible: false
keypoint_visible_rate: 1.0
dataset_obs_steps: ${n_obs_steps}

# === Shape Meta (same as paper) ===
shape_meta:
  obs:
    image:
      shape: [3, 96, 96]
      type: rgb
    agent_pos:
      shape: [2]
      type: low_dim
  action:
    shape: [2]

# === Flow Matching Policy (Hybrid, aligned with paper) ===
policy:
  _target_: dpfm.policy.flow_matching_unet_hybrid_image_policy.FlowMatchingUnetHybridImagePolicy
  
  # Same UNet architecture as DDPM baseline
  shape_meta: ${shape_meta}
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  
  # UNet architecture (same as paper)
  down_dims: [512, 1024, 2048]
  kernel_size: 5
  n_groups: 8
  diffusion_step_embed_dim: 128
  cond_predict_scale: true
  
  # Observation encoder (same as paper)
  obs_encoder_group_norm: true
  crop_shape: [84, 84]
  eval_fixed_crop: true
  
  # Conditioning
  obs_as_global_cond: ${obs_as_global_cond}
  
  # Flow Matching specific - configurable inference steps
  num_inference_steps: 4

# === Optimizer (same as paper) ===
optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

# === EMA (same as paper) ===
ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

# === Training (aligned with paper: 3050 epochs) ===
training:
  device: cuda:0
  seed: 42
  debug: false
  resume: true
  
  # Paper uses 3050 epochs
  num_epochs: 3050
  
  # Gradient accumulation
  gradient_accumulate_every: 1
  
  # LR scheduler
  lr_scheduler: cosine
  lr_warmup_steps: 500
  
  # EMA
  use_ema: true
  freeze_encoder: false
  
  # Evaluation frequency (same as paper)
  rollout_every: 50
  checkpoint_every: 50
  val_every: 1
  sample_every: 5
  
  # No step limits
  max_train_steps: null
  max_val_steps: null
  
  # Progress bar
  tqdm_interval_sec: 1.0
  
  # Early stopping (based on 10 consecutive rollouts without improvement)
  early_stopping: true
  early_stopping_patience: 10  # 10 rollouts = 10 * 50 = 500 epochs
  early_stopping_min_epochs: 500  # Minimum epochs before early stopping kicks in

# === DataLoader (adjusted for cluster: 8 CPUs per GPU) ===
dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: true
  pin_memory: true
  persistent_workers: false

val_dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: false
  pin_memory: true
  persistent_workers: false

# === Checkpointing (save best and last only) ===
checkpoint:
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 1  # Only keep the best checkpoint
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: true
  save_last_snapshot: false

# === Logging (WandB online with detailed tracking) ===
logging:
  project: dpfm_pusht_v2
  group: ${exp_name}
  name: '${exp_name}_step${policy.num_inference_steps}_seed${training.seed}'
  resume: true
  mode: online
  tags:
    - train_fm_hybrid
    - pusht_image
    - steps_${policy.num_inference_steps}
    - seed_${training.seed}
    - ${exp_name}

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: '${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}'

hydra:
  job:
    chdir: true
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
