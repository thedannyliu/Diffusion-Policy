# Flow Matching for Real Robot Two-Camera Dataset
# Based on train_fm_unet_hybrid_image_workspace.yaml
# Modified for real robot data with two cameras and 6D action space

defaults:
  - _self_
  - task: real_robot_image

name: train_fm_real_robot
_target_: dpfm.workspace.train_fm_unet_hybrid_image_workspace.TrainFlowMatchingUnetHybridImageWorkspace

exp_name: default
task_name: ${task.name}

# === Key Settings ===
horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
obs_as_global_cond: true
past_action_visible: false
keypoint_visible_rate: 1.0
dataset_obs_steps: ${n_obs_steps}

# === Shape Meta (from task config) ===
shape_meta: ${task.shape_meta}

# === Flow Matching Policy ===
policy:
  _target_: dpfm.policy.flow_matching_unet_hybrid_image_policy.FlowMatchingUnetHybridImagePolicy
  
  shape_meta: ${shape_meta}
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  
  # UNet architecture
  down_dims: [512, 1024, 2048]
  kernel_size: 5
  n_groups: 8
  diffusion_step_embed_dim: 128
  cond_predict_scale: true
  
  # Observation encoder - crop to match training resolution
  obs_encoder_group_norm: true
  crop_shape: [216, 288]  # 90% of 240x320
  eval_fixed_crop: true
  
  # Conditioning
  obs_as_global_cond: ${obs_as_global_cond}
  
  # Flow Matching - inference steps
  num_inference_steps: 4

# === Optimizer ===
optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

# === EMA ===
ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

# === Training ===
training:
  device: cuda:0
  seed: 42
  debug: false
  resume: true
  
  # Training epochs - 600 is typical for real robot
  num_epochs: 600
  
  # Gradient accumulation
  gradient_accumulate_every: 1
  
  # LR scheduler
  lr_scheduler: cosine
  lr_warmup_steps: 500
  
  # EMA
  use_ema: true
  freeze_encoder: false
  
  # Evaluation frequency (no rollout for real robot training)
  rollout_every: 1000000  # Effectively disabled
  checkpoint_every: 50
  val_every: 1
  sample_every: 5
  
  # No step limits
  max_train_steps: null
  max_val_steps: null
  
  # Progress bar
  tqdm_interval_sec: 1.0
  
  # Early stopping disabled for real robot (no rollout)
  early_stopping: false
  early_stopping_patience: 10
  early_stopping_min_epochs: 100

# === DataLoader ===
dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: true
  pin_memory: true
  persistent_workers: false

val_dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: false
  pin_memory: true
  persistent_workers: false

# === Checkpointing ===
checkpoint:
  topk:
    monitor_key: train_loss
    mode: min
    k: 5
    format_str: 'epoch={epoch:04d}-train_loss={train_loss:.3f}.ckpt'
  save_last_ckpt: true
  save_last_snapshot: false

# === Logging ===
logging:
  project: dpfm_real_robot
  group: ${exp_name}
  name: '${task_name}_step${policy.num_inference_steps}_seed${training.seed}'
  resume: true
  mode: online
  tags:
    - train_fm_real
    - ${task_name}
    - steps_${policy.num_inference_steps}
    - seed_${training.seed}
    - ${exp_name}

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: '${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}'

hydra:
  job:
    chdir: true
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
