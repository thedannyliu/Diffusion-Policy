# Flow Matching Transformer Hybrid Image Policy Config
# FM counterpart to diffusion_policy/config/train_diffusion_transformer_hybrid_workspace.yaml

defaults:
  - _self_
  - task: pusht_image

name: train_fm_transformer_hybrid
_target_: dpfm.workspace.train_fm_transformer_hybrid_image_workspace.TrainFlowMatchingTransformerHybridImageWorkspace

exp_name: default
task_name: pusht_image

# === Key Paper Settings ===
horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
obs_as_cond: true
past_action_visible: false
keypoint_visible_rate: 1.0
dataset_obs_steps: ${n_obs_steps}

# === Shape Meta (same as paper) ===
shape_meta:
  obs:
    image:
      shape: [3, 96, 96]
      type: rgb
    agent_pos:
      shape: [2]
      type: low_dim
  action:
    shape: [2]

# === Flow Matching Transformer Policy ===
policy:
  _target_: dpfm.policy.flow_matching_transformer_hybrid_image_policy.FlowMatchingTransformerHybridImagePolicy
  
  shape_meta: ${shape_meta}
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  
  # Transformer architecture (same as DDPM baseline)
  n_layer: 8
  n_head: 4
  n_emb: 256
  p_drop_emb: 0.0
  p_drop_attn: 0.3
  causal_attn: true
  time_as_cond: true
  obs_as_cond: ${obs_as_cond}
  n_cond_layers: 0
  pred_action_steps_only: false
  
  # Observation encoder
  crop_shape: [76, 76]
  obs_encoder_group_norm: false
  eval_fixed_crop: false
  
  # Flow Matching specific
  num_inference_steps: 4
  sigma_min: 0.0

# === Optimizer ===
optimizer:
  transformer_weight_decay: 1.0e-3
  obs_encoder_weight_decay: 1.0e-6
  learning_rate: 1.0e-4
  betas: [0.9, 0.95]

# === EMA ===
ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

# === Training ===
training:
  device: cuda:0
  seed: 42
  debug: false
  resume: true
  
  num_epochs: 3050
  gradient_accumulate_every: 1
  lr_scheduler: cosine
  lr_warmup_steps: 500
  
  use_ema: true
  freeze_encoder: false
  
  rollout_every: 50
  checkpoint_every: 50
  val_every: 1
  sample_every: 5
  
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0
  
  early_stopping: true
  early_stopping_patience: 10
  early_stopping_min_epochs: 500

# === DataLoader ===
dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: true
  pin_memory: true
  persistent_workers: false

val_dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: false
  pin_memory: true
  persistent_workers: false

# === Checkpointing ===
checkpoint:
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 1
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: true
  save_last_snapshot: false

# === Logging ===
logging:
  project: dpfm_pusht_v2
  group: ${exp_name}
  name: '${exp_name}_transformer_step${policy.num_inference_steps}_seed${training.seed}'
  resume: true
  mode: online
  tags:
    - train_fm_transformer
    - pusht_image
    - steps_${policy.num_inference_steps}
    - seed_${training.seed}
    - ${exp_name}

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: '${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}'

hydra:
  job:
    chdir: true
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
